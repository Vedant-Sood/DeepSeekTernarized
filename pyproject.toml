[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boilerplate"
version = "0.1.0"
description = "Ternary-first inference engine for MoE LLMs, plus a ternarization pipeline for DeepSeek V4.1 Flash"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10",
    "safetensors>=0.7",
    "numpy",
    "pyyaml",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
hf = ["transformers>=4.50", "huggingface_hub>=0.25"]
dev = ["pytest>=8"]
# the vendored official reference imports these at module load; tokenizers also feeds engram hashing
reference = ["sympy", "Pillow", "tokenizers>=0.20", "transformers>=4.50"]

[project.scripts]
boilerplate = "boilerplate.cli:main"

[tool.setuptools.packages.find]
include = ["boilerplate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
