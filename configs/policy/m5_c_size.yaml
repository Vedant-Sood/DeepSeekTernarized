# M5 variant C-size: routed experts TQ1 k=1 + GPTQ (512 calibration sequences, plain fit below
# --calib-min-tokens), engram tables kept FP8, everything else as released.
name: m5-c_size
default: {mode: A}
rules:
  - match: '^layers\.\d+\.ffn\.experts\.\d+\.w[123]$'
    mode: C
    k: 1
    group: 128
    packing: tq1
    scale_dtype: fp16
    act: int8
    gptq: true
